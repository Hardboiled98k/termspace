appId: dev.termscape.app
productName: Termscape
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
# node-pty 是原生模块，需按 Electron ABI 打进包
asarUnpack:
  - '**/node_modules/node-pty/**'
publish: null # 不发布/不做 auto-update（避免 channel 计算报错）
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
  darkModeSupport: true
  # 公证的前置条件：必须开 hardened runtime，且用 entitlements 放行 V8 的 JIT
  # 和 node-pty 这类原生模块，否则签完能过公证但一启动就崩
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 签名身份自动从钥匙串里找 Developer ID Application。
  # 想打未签名包用 `npm run dist`（它设了 CSC_IDENTITY_AUTO_DISCOVERY=false）
  # electron-builder 26 这里只收布尔值；teamId / API 密钥走环境变量
  # （APPLE_TEAM_ID / APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER）
  notarize: true
dmg:
  title: Termscape

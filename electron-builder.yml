appId: dev.termboard.app
productName: TermBoard
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
# node-pty 是原生模块，需按 Electron ABI 打进包
asarUnpack:
  - '**/node_modules/node-pty/**'
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
  # 本地未签名构建（先能双击跑；上架再补签名公证）
  identity: null
  darkModeSupport: true
dmg:
  title: TermBoard

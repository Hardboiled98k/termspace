appId: dev.termscape.app
productName: Termscape
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  # 手机端 PWA：主进程用 app.getAppPath()/mobile 直接读，asar 内可读
  - mobile/**/*
# node-pty 是原生模块，需按 Electron ABI 打进包
asarUnpack:
  - '**/node_modules/node-pty/**'
# 自动更新的元数据来源。**URL 只是占位** —— 真实地址在 app 里配
# （设置 → 更新 → 更新源），运行期用 autoUpdater.setFeedURL 覆盖它。
# 这样换发布源不用重新打包，也不用把某个域名焊死在二进制里。
# 这里必须有 publish 配置，否则 electron-builder 不生成 app-update.yml，
# electron-updater 一启动就找不到配置文件。
publish:
  provider: generic
  url: https://updates.invalid/termscape/
  # publishAutoUpdate 的意思是"生成更新元数据（latest-mac.yml）"，**不是**"自动上传"。
  # 真正决定上不上传的是构建命令有没有传 --publish，而 generic provider 根本没有上传端。
  publishAutoUpdate: true
mac:
  # 不配这个的话打包日志会说 "default Electron icon is used"，
  # 用户 Dock 里看到的就是 Electron 的默认图标
  icon: build/icon.icns
  category: public.app-category.developer-tools
  target:
    # dmg 给人手动装；**zip 是自动更新用的** —— Squirrel.Mac 只认 zip，
    # 少了它 electron-updater 能查到新版本但下载不下来
    #
    # **这里故意不写 arch**：在 target 上写死 `arch: [arm64, x64]` 会**压过命令行的
    # `--arm64`/`--x64`**（配置优先），于是 `dist:local` 明明只想要本机架构，
    # 还是闷头跑完两轮签名 —— 25 分钟变 50 分钟，而且日志里没有任何提示。
    # 架构由 package.json 里各个 dist 脚本用 CLI 标志决定：
    #   dist:signed / dist → --arm64 --x64（发版必须两个都出：Intel Mac 上
    #                        装 arm64 包会直接报"无法打开"）
    #   dist:local        → --arm64（自用，本机架构就够）
    # 漏了 x64 不会静默通过：publish.sh 要求两个 zip 都在才肯发。
    - target: dmg
    - target: zip
  darkModeSupport: true
  # 公证的前置条件：必须开 hardened runtime，且用 entitlements 放行 V8 的 JIT
  # 和 node-pty 这类原生模块，否则签完能过公证但一启动就崩
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # 签名身份自动从钥匙串里找 Developer ID Application。
  # 想打未签名包用 `npm run dist`（它设了 CSC_IDENTITY_AUTO_DISCOVERY=false）
  # electron-builder 26 这里只收布尔值；teamId / API 密钥走环境变量
  # （APPLE_TEAM_ID / APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER）
  notarize: true
dmg:
  title: Termscape

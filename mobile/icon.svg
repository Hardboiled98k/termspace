<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Termscape">
  <!-- maskable：内容全部收在中心 80% 安全区内，被系统裁成圆形也不缺角 -->
  <rect width="512" height="512" fill="#0b0d12" />
  <g stroke="#3a3a3f" stroke-width="9" stroke-linecap="round">
    <line x1="176" y1="196" x2="336" y2="196" />
    <line x1="336" y1="196" x2="336" y2="316" />
  </g>
  <!-- 三个节点 = 画布上的终端，边框颜色即 agent 状态（蓝=跑 / 橙=等你 / 灰=空闲） -->
  <rect x="112" y="152" width="128" height="88" rx="20" fill="#131315" stroke="#0a84ff" stroke-width="10" />
  <rect x="272" y="152" width="128" height="88" rx="20" fill="#131315" stroke="#ff9f0a" stroke-width="10" />
  <rect x="272" y="272" width="128" height="88" rx="20" fill="#131315" stroke="#48484a" stroke-width="10" />
  <!-- 提示符 -->
  <path d="M140 182 l20 14 -20 14" fill="none" stroke="#f5f5f7" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="336" cy="196" r="13" fill="#ff9f0a" />
</svg>
